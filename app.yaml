runtime: nodejs20

env_variables:
  NODE_ENV: "production"
  GCS_BUCKET: signals-db-strange-signals-dashboard
  GCS_DB_FILE: alerts.db

handlers:
  # Handle API and WebSocket routes first
  - url: /graphql
    script: auto
    secure: always

  # Handle webhook endpoint
  - url: /webhook
    script: auto
    secure: always

  # Serve dashboard static files (more specific path first)
  - url: /dashboard/static/(.*)
    static_files: dashboard/build/static/\1
    upload: dashboard/build/static/.*
    secure: always

  # Serve public static files
  - url: /(.*\.(json|ico|js|css|png|jpg|gif))$
    static_files: public/\1
    upload: public/.*\.(json|ico|js|css|png|jpg|gif)$
    secure: always

  # Serve dashboard routes
  - url: /dashboard.*
    static_files: dashboard/build/index.html
    upload: dashboard/build/index.html
    secure: always

  # Serve the main landing page
  - url: /
    static_files: public/index.html
    upload: public/index.html
    secure: always

  # All other routes
  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 2 